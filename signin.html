<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Sign In - E-com Website</title>
  </head>
  <body>
    <!-- ========== Start Navbar ========== -->
    <header class="section-navbar">
      <section class="top_txt">
        <div class="head container">
          <div class="head_txt">
            <p>Free shipping, 30-day return or refund guarantee.</p>
          </div>
          <div class="sing_in_up">
            <a href="signin.html">SIGN IN</a>
            <a href="signup.html">SIGN UP</a>
          </div>
        </div>
      </section>

      <div class="container">
        <div class="navbar-brand">
          <a href="index.html">
            <img
              src="/images/log.png"
              alt="singh eCommerce logo"
              class="logo"
              width="80%"
              height="auto"
            />
          </a>
        </div>

        <nav class="navbar">
          <ul>
            <li class="nav-item">
              <a href="/" class="nav-link">Home</a>
            </li>
            <li class="nav-item">
              <a href="about.html" class="nav-link">About</a>
            </li>
            <li class="nav-item">
              <a href="products.html" class="nav-link">Products</a>
            </li>
            <li class="nav-item">
              <a href="contact.html" class="nav-link">Contact</a>
            </li>
          </ul>
        </nav>

        <div class="mobile-navbar-btn">
          <ion-icon name="menu-outline" class="mobile-nav-icon"></ion-icon>
          <ion-icon name="close-outline" class="mobile-nav-icon"></ion-icon>
        </div>
      </div>
    </header>
    <!-- ========== End Navbar ========== -->

    <!-- ========== Start Sign In Section ========== -->
    <section class="section-signin">
      <div class="container">
        <div class="signin-wrapper">
          <div class="signin-content">
            <h1 class="signin-heading">Welcome Back</h1>
            <p class="signin-subheading">Sign in to your account</p>

            <form class="signin-form" id="signinForm">
              <!-- Email -->
              <div class="form-group">
                <label for="email" class="form-label">Email Address *</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="form-input"
                  placeholder="Enter your email address"
                  required
                />
                <span class="error-message" id="emailError"></span>
              </div>

              <!-- Password -->
              <div class="form-group">
                <label for="password" class="form-label">Password *</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="form-input"
                  placeholder="Enter your password"
                  required
                />
                <span class="error-message" id="passwordError"></span>
              </div>

              <!-- Remember Me -->
              <div class="form-group checkbox-group">
                <input
                  type="checkbox"
                  id="rememberMe"
                  name="rememberMe"
                />
                <label for="rememberMe" class="checkbox-label">
                  Remember me
                </label>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="signin-btn">Sign In</button>

              <!-- Forgot Password & Sign Up Links -->
              <div class="auth-links">
                <a href="forgot-password.html" class="forgot-password-link">
                  Forgot Password?
                </a>
                <span class="divider">|</span>
                <a href="signup.html" class="signup-link">Create Account</a>
              </div>
            </form>

            <!-- Alternative Sign In Options -->
            <div class="alternative-signin">
              <p class="divider-text">Or continue with</p>
              <div class="social-buttons">
                <button class="social-btn google-btn" id="googleBtn">
                  <i class="fab fa-google"></i> Google
                </button>
                <button class="social-btn facebook-btn" id="facebookBtn">
                  <i class="fab fa-facebook-f"></i> Facebook
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- ========== End Sign In Section ========== -->

    <!-- ========== Start Footer ========== -->
    <footer class="footer">
      <div class="container">
        <div class="footer-content">
          <p>&copy; 2024 E-com Website. All rights reserved.</p>
          <div class="footer-links">
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms & Conditions</a>
            <a href="contact.html">Contact Us</a>
          </div>
        </div>
      </div>
    </footer>
    <!-- ========== End Footer ========== -->

    <script src="signin.js"></script>
  </body>
</html>
